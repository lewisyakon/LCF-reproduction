[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lcf-reproduction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch==2.6.0", "transformers==4.51.3", "datasets==3.5.0",
  "accelerate==1.6.0", "safetensors==0.5.3", "numpy>=1.26,<3", "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
